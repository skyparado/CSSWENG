name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  test:
    name: Lint, type-check & Vitest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: clinic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://clinic:clinic@localhost:5432/clinic_test?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      # Session cookie signing secret for the test runs. Not a real secret;
      # safe to live in the workflow because CI builds don't accept external
      # traffic. Production uses a GitHub Actions secret instead.
      SESSION_SECRET: ci-test-secret-do-not-use-in-production-only-for-vitest-runs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace backend

      - name: Apply migrations
        run: npm run prisma:migrate:deploy --workspace backend

      - name: Build shared schemas
        run: npm run build --workspace @clinic/schemas

      - name: Type-check
        run: npm run typecheck --workspaces --if-present

      - name: Run Vitest
        run: npm run test --workspaces --if-present

  e2e:
    name: Playwright (booking, documents, email, PDF timing)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: clinic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

      s3:
        image: adobe/s3mock:latest
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: clinic-documents
        ports:
          - 9000:9090

      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DATABASE_URL: postgresql://clinic:clinic@localhost:5432/clinic?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      SESSION_SECRET: ci-test-secret-do-not-use-in-production-only-for-e2e-runs
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      REMINDERS_ENABLED: 'false'
      EMAIL_PROVIDER: smtp
      SMTP_URL: smtp://localhost:1025

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run prisma:generate --workspace backend
      - run: npm run prisma:migrate:deploy --workspace backend
      - run: npm run db:seed --workspace @clinic/backend
      - run: npm run build --workspace @clinic/schemas
      # Installs the system libraries Puppeteer's Chrome needs as well.
      - run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
