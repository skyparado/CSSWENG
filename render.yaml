# Render Blueprint: one Docker web service (API + built frontend), managed
# PostgreSQL and Redis-compatible Key Value. Deploy from the Render dashboard:
# New → Blueprint → this repository. Values marked `sync: false` are asked for
# on first deploy (object storage credentials live outside Render).
services:
  - type: web
    name: clinic-emr
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: clinic-redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN # the public site URL, e.g. https://clinic-emr.onrender.com
        sync: false
      - key: CLINIC_TIMEZONE
        value: Asia/Manila
      # Patient field encryption and blind-index keys (backend/src/lib/fieldCrypto.ts).
      # Each must be exactly 32 random bytes, base64, so Render's generateValue
      # won't do. Generate each with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      # Back both up: losing either makes stored patient data unreadable or unsearchable.
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: BLIND_INDEX_KEY
        sync: false
      # S3-compatible storage for PDFs and signatures (AWS S3, Cloudflare R2, …).
      # Leave S3_ENDPOINT empty for AWS; set S3_FORCE_PATH_STYLE=false for AWS.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        sync: false
      # Email for sending documents (and reminders): any SMTP relay, e.g.
      # smtps://apikey:SECRET@smtp.sendgrid.net:465 or Amazon SES / Brevo SMTP.
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_URL
        sync: false
      - key: EMAIL_FROM # e.g. "Dr. Pacio's Clinic <clinic@yourdomain.ph>"
        sync: false
      # SMS reminders: "stub" only logs. When the clinic picks a provider set
      # SMS_PROVIDER to twilio or semaphore and add that provider's credentials
      # (see backend/.env.example). PUBLIC_BASE_URL is where delivery reports arrive.
      - key: SMS_PROVIDER
        value: stub
      - key: PUBLIC_BASE_URL # e.g. https://clinic-emr.onrender.com (no trailing slash)
        sync: false
      # Nightly database backup (pg_dump, encrypted) to a SEPARATE bucket, and the
      # retention purge. BACKUP_ENCRYPTION_KEY: 32 random bytes, base64 (as above);
      # back it up somewhere other than the backups themselves, or they cannot be read.
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false

  - type: keyvalue
    name: clinic-redis
    plan: free
    maxmemoryPolicy: noeviction # BullMQ must never have its jobs evicted
    ipAllowList: [] # reachable only from Render's private network

databases:
  - name: clinic-db
    plan: free
    databaseName: clinic
    user: clinic
