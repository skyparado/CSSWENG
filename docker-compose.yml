# Local development services: PostgreSQL, Redis and S3-compatible storage.
# Bring up with `npm run db:up` (docker compose up -d).
services:
  postgres:
    image: postgres:16-alpine
    container_name: clinic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clinic-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for local dev (clinical images, generated PDFs).
  # MinIO images are no longer pullable from Docker Hub or quay.io, so this is
  # Adobe's S3 mock. Files persist in the s3-data volume.
  s3:
    image: adobe/s3mock:latest
    container_name: clinic-s3
    user: "0" # the named volume is root-owned
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: clinic-documents,clinic-backups
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9000:9090"
    volumes:
      - s3-data:/data

  # Catches every email the app sends (EMAIL_PROVIDER=smtp). Inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: clinic-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  redis-data:
  s3-data:
